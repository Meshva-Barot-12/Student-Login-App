name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffold Android Platform Files
        run: |
          flutter create --project-name student_login_app --platforms=android --org com.silveroak.studentlogin .
          flutter pub get

      - name: Run Flutter Tests
        run: flutter test || true

      - name: Accept Android Licenses & Check Environment
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Build Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Student-Login-App-Release-APK
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Submission v1.0.0 — Student Login App (Release APK)"
          body: |
            ### 🎓 Silver Oak University — Assignment 2 Submission
            - **Course**: Flutter Framework Principles (1040245211)
            - **Institute**: SOCCA | IMSCIT (3rd Sem)
            - **Deliverable**: Android Release APK (`app-release.apk`)
            
            #### 📱 Direct Download:
            Download the attached `app-release.apk` below and install it directly on any Android smartphone or emulator.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
